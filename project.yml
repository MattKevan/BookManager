name: Stacks
options:
  bundleIdPrefix: com.mattkevan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Automerge:
    url: https://github.com/automerge/automerge-swift.git
    exactVersion: 0.7.2
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
  libmobi-swift:
    url: https://github.com/awxkee/libmobi-swift.git
    exactVersion: 1.0.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  StacksCore:
    type: framework
    platform: macOS
    sources:
      - StacksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattkevan.StacksCore
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: Automerge
      - package: GRDB
      - package: ZIPFoundation
      - package: libmobi-swift
        product: libmobi

  Stacks:
    type: application
    platform: macOS
    sources:
      - Stacks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattkevan.Stacks
        PRODUCT_NAME: Stacks
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/Stacks.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N7J3BYZ94H
        INFOPLIST_KEY_CFBundleDisplayName: Stacks
        # App Nap suspends idle apps; for an app holding a USB/MTP session this
        # can let the host idle-suspend the device link (Kindle drops ~30s
        # after the last transfer). Opt out so the held session stays live.
        INFOPLIST_KEY_NSAppSleepDisabled: YES
        INFOPLIST_KEY_LSApplicationCategoryType: >-
          public.app-category.productivity
    dependencies:
      - target: StacksCore

  StacksCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - StacksCoreTests
    resources:
      - path: StacksCoreTests/MobiImport/Fixtures
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: StacksCore
      - package: GRDB
      - package: ZIPFoundation
      - package: libmobi-swift
        product: libmobi

  StacksUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - StacksUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Stacks

schemes:
  Stacks:
    build:
      targets:
        Stacks: all
        StacksCore: all
        StacksCoreTests: [test]
        StacksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StacksCoreTests
        - StacksUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
