name: Stacks
options:
  bundleIdPrefix: com.mattkevan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
  libmobi-swift:
    url: https://github.com/awxkee/libmobi-swift.git
    exactVersion: 1.0.2
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    exactVersion: 2.26.0
  swift-service-lifecycle:
    url: https://github.com/swift-server/swift-service-lifecycle.git
    from: 2.0.0
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    exactVersion: 1.8.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  StacksCore:
    type: framework
    platform: macOS
    sources:
      - StacksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattkevan.StacksCore
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: GRDB
      - package: ZIPFoundation
      - package: libmobi-swift
        product: libmobi
      - package: Hummingbird
      - package: swift-service-lifecycle
        product: ServiceLifecycle

  Stacks:
    type: application
    platform: macOS
    sources:
      - Stacks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattkevan.Stacks
        PRODUCT_NAME: Stacks
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/Stacks.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N7J3BYZ94H
        INFOPLIST_KEY_CFBundleDisplayName: Stacks
        # Local Network privacy (macOS 15+): browsing/advertising Bonjour
        # services triggers the system prompt — declare the usage string and
        # the services we touch.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          Stacks discovers and shares book libraries on your local network.
        INFOPLIST_KEY_NSBonjourServices:
          - _bookmanager._tcp
        # App Nap suspends idle apps; for an app holding a USB/MTP session this
        # can let the host idle-suspend the device link (Kindle drops ~30s
        # after the last transfer). Opt out so the held session stays live.
        INFOPLIST_KEY_NSAppSleepDisabled: YES
        INFOPLIST_KEY_LSApplicationCategoryType: >-
          public.app-category.productivity
    dependencies:
      - target: StacksCore

  StacksCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - StacksCoreTests
    resources:
      - path: StacksCoreTests/MobiImport/Fixtures
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: StacksCore
      - package: GRDB
      - package: ZIPFoundation
      - package: libmobi-swift
        product: libmobi
      - package: Hummingbird

  StacksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - StacksTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Stacks.app/Contents/MacOS/Stacks
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Stacks

  StacksServer:
    type: tool
    platform: macOS
    sources:
      - StacksServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattkevan.StacksServer
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: StacksCore
      - package: swift-argument-parser
        product: ArgumentParser

  StacksUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - StacksUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Stacks

schemes:
  Stacks:
    build:
      targets:
        Stacks: all
        StacksCore: all
        StacksServer: all
        StacksCoreTests: [test]
        StacksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StacksCoreTests
        - StacksTests
        - StacksUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
